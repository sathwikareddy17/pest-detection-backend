spring.application.name=pest-detection-backend
server.port=${PORT:8080}

# Database. Default is an H2 file database stored in ./data (no install needed).
# Override with environment variables to point at MySQL/PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pestdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. Set JWT_SECRET to a long random string (32+ characters) in production.
app.jwt.secret=${JWT_SECRET:change-this-secret-before-production-use-a-long-random-string}
app.jwt.expiration-ms=86400000

# Browser origins allowed to call the API (comma separated). Not needed when using the Vite proxy.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Demo data: creates users and a sample farm on first start when the database is empty.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.user-password=${USER_PASSWORD:field123}
